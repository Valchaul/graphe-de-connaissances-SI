<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Graphe de connaissances">
  <!-- Pastille noire, dessin blanc : un parcours qui monte de notion en notion (départ, étape, objectif atteint)
       et une branche supplémentaire qui part de l'étape. Les virages sont arrondis comme les flèches de la carte. -->
  <rect width="32" height="32" rx="8" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 21 V19.5 Q8 16 11.5 16 H13"/>
    <path d="M16 13 V11.5 Q16 8 19.5 8 H21"/>
    <path d="M16 19 V20.5 Q16 24 19.5 24 H21"/>
  </g>
  <circle cx="8" cy="24" r="2.6" fill="#fff"/>
  <circle cx="16" cy="16" r="2.6" fill="#fff"/>
  <rect x="21" y="4.6" width="7.4" height="7.4" rx="2.2" fill="#fff"/>
  <!-- bulle non cochée : même forme que l'objectif, mais vide -->
  <rect x="21.8" y="20.8" width="5.8" height="6.4" rx="1.9" fill="none" stroke="#fff" stroke-width="1.6"/>
  <path d="M22.7 8.5 L24.2 10 L26.6 6.9" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
