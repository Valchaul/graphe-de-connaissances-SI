<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphe de connaissances SI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barre">
    <h1>Graphe de connaissances <span>Sciences de l'ingénieur</span></h1>
    <div class="outils">
      <div id="progression" class="progression" role="group"
           title="Notions que tu as cochées comme acquises. Elles sont mémorisées dans ce navigateur uniquement.">
        <span id="prog-texte" class="prog-texte"></span>
        <span class="prog-barre"><span id="prog-remplissage"></span></span>
        <span id="prog-alerte" class="prog-alerte" hidden
              title="Ce navigateur refuse la sauvegarde (navigation privée ?) : la progression sera perdue à la fermeture.">⚠</span>
        <button id="prog-effacer" class="bouton-discret" type="button" hidden>Effacer</button>
      </div>
      <input id="recherche" type="search" placeholder="Rechercher une notion…" autocomplete="off">
    </div>
  </header>

  <nav id="legende" aria-label="Domaines (cliquer pour masquer / afficher)">
    <button id="bascule-ilots" class="bascule" type="button" aria-pressed="true"
              title="Afficher ou masquer les cadres qui regroupent les notions par domaine">
        Îlots par domaine
      </button>
</nav>

  <main>
    <div id="graphe" aria-label="Carte des notions"></div>

    <aside id="panneau" hidden>
      <button id="fermer" aria-label="Fermer">×</button>
      <div class="badges">
        <p id="p-domaine" class="badge"></p>
        <p id="p-niveau" class="badge badge-niveau"></p>
      </div>
      <h2 id="p-titre"></h2>
      <p id="p-description"></p>

      <!-- Suivi de progression : coche la notion comme acquise (js/progression.js) -->
      <button id="p-acquise" class="bouton-acquise" type="button" aria-pressed="false"></button>
      <p id="p-acquise-aide" class="aide-acquise" hidden>
        <span id="p-acquise-aide-texte"></span>
        <button id="p-acquise-aide-bouton" class="bouton-discret" type="button">Les cocher aussi</button>
      </p>

      <h3>Ressources</h3>
      <ul id="p-ressources"></ul>

      <h3>Prérequis</h3>
      <ul id="p-prerequis" class="liens-notions"></ul>

      <!-- Chemin d'apprentissage : un seul bouton qui l'affiche ou le masque (js/chemin.js) -->
      <div id="p-chemin-zone" hidden>
        <button id="p-chemin-bouton" class="bouton-chemin" type="button"
                aria-expanded="false" aria-controls="p-chemin"></button>
        <section id="p-chemin" hidden aria-label="Chemin d'apprentissage">
          <p id="p-chemin-resume" class="chemin-resume"></p>
          <ol id="p-chemin-liste" class="chemin"></ol>
        </section>
      </div>

      <h3>Ouvre vers</h3>
      <ul id="p-suivants" class="liens-notions"></ul>
    </aside>
  </main>

  <div id="erreurs" hidden></div>

  <!-- Bibliothèques (graphe + placement automatique) -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>

  <!-- Contenu, puis application. L'ordre compte : chaque fichier utilise ceux qui le précèdent. -->
  <script src="data/notions.js"></script>
  <script src="data/favicons.js"></script>
  <script src="js/verification.js"></script>
  <script src="js/config.js"></script>
  <script src="js/graphe.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/placement.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/panneau.js"></script>
  <script src="js/chemin.js"></script>
  <script src="js/filtres.js"></script>
  <script src="js/recherche.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
